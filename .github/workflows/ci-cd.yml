name: kestrel_backend

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

permissions:
  contents: read

jobs:
  run-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          python -m pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: run-unit-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kestrel_backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run-migrations:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Flyway migrations against production DB
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/db_migration:/flyway/sql \
            flyway/flyway:latest \
            -url="${{ secrets.PROD_FLYWAY_URL }}" \
            -user="${{ secrets.PROD_DB_USER }}" \
            -password="${{ secrets.PROD_DB_PASSWORD }}" \
            -schemas="${{ secrets.PROD_DB_SCHEMA }}" \
            -locations=filesystem:/flyway/sql \
            -connectRetries=5 \
            migrate

  deploy-to-railway:
    runs-on: ubuntu-latest
    needs: run-migrations
    if: github.event_name == 'push'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
      HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway service redeploy --service $SERVICE_ID --yes

      - name: Wait until service is healthy
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "Missing HEALTH_URL"
            exit 1
          fi

          MAX_RETRIES=20
          INTERVAL=30
          i=1

          while [ $i -le $MAX_RETRIES ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL/health" || echo "000")

            if [ "$STATUS" = "200" ]; then
              echo "Service is healthy"
              exit 0
            fi

            echo "Attempt $i/$MAX_RETRIES — got $STATUS, retrying in ${INTERVAL}s"
            i=$((i+1))
            sleep $INTERVAL
          done

          echo "Service never became healthy after $((MAX_RETRIES * INTERVAL))s"
          exit 1
